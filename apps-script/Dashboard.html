<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game dashboard · Science is Khool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF8243; --pink: #FFC0CB; --yellow: #FCE883; --teal: #069494; --teal-ink: #057A7A;
  --orange-tint: #FFE6DA; --yellow-tint: #FEF8D9; --teal-tint: #DDF3F2; --good-tint: #D8F3E4;
  --ink: #1F2A2E; --muted: #5B6B70; --b: 3px solid var(--ink); --font: "Open Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: #fff; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 800; }
h1 small { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); }
h2 { font-size: 1.1rem; font-weight: 800; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .tag { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 99px; padding: 1px 8px; background: var(--yellow); }
a.btn, button.btn { font: 800 .9rem var(--font); color: var(--ink); background: #fff; border: var(--b); border-radius: 12px; padding: 8px 14px; box-shadow: 0 4px 0 var(--ink); text-decoration: none; cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; background: var(--teal); border: var(--b); border-radius: 18px; padding: 12px; box-shadow: 6px 6px 0 var(--ink); margin-bottom: 18px; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #fff; flex: 1 1 160px; }
.filters select { font: 700 1rem var(--font); color: var(--ink); border: var(--b); border-radius: 10px; padding: 8px 10px; background: #fff; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi { border: var(--b); border-radius: 16px; padding: 12px 14px; box-shadow: 4px 4px 0 var(--ink); background: #fff; }
.kpi:nth-child(1) { background: var(--yellow-tint); } .kpi:nth-child(2) { background: var(--teal-tint); } .kpi:nth-child(3) { background: var(--good-tint); } .kpi:nth-child(4) { background: var(--orange-tint); }
.kpi b { display: block; font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.kpi span { font-size: .78rem; font-weight: 700; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
.card { border: var(--b); border-radius: 18px; padding: 14px; box-shadow: 6px 6px 0 var(--ink); background: #fff; min-width: 0; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .9rem; }
th { text-align: left; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2.5px solid var(--ink); background: #fff; white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid #E3ECEC; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--yellow-tint); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow: auto; max-height: 70vh; border-radius: 10px; }
.matrix th, .matrix td { white-space: nowrap; }
.matrix th.g { text-align: center; max-width: 110px; white-space: normal; line-height: 1.2; vertical-align: bottom; }
.matrix td.c { text-align: center; font-weight: 700; font-size: .85rem; }
.matrix thead th { position: sticky; top: 0; z-index: 2; }
.matrix .stick { position: sticky; left: 0; background: #fff; z-index: 1; }
.matrix thead .stick { z-index: 3; }
.matrix td.hi { background: var(--good-tint); } .matrix td.mid { background: var(--yellow-tint); } .matrix td.lo { background: var(--orange-tint); }
.matrix tr:hover td.stick { background: var(--yellow-tint); }
.name { font-weight: 700; } .reg { color: var(--muted); font-size: .8rem; margin-right: 6px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; font-weight: 700; color: var(--muted); margin: 0 0 10px; }
.legend i { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 4px; vertical-align: -3px; margin-right: 4px; }
.err { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid #E3ECEC; }
.err .bar { grid-column: 1 / -1; height: 8px; border: 2px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.err .bar i { display: block; height: 100%; background: var(--orange); }
.err b { font-size: .9rem; } .err small { color: var(--muted); font-weight: 700; font-size: .75rem; }
.err .n { font-weight: 800; }
.empty { color: var(--muted); font-weight: 600; padding: 10px 0; }
dialog { border: var(--b); border-radius: 18px; padding: 0; box-shadow: 8px 8px 0 var(--ink); width: min(680px, 94vw); max-height: 86vh; }
dialog::backdrop { background: rgba(31, 42, 46, .45); }
.dlg-head { background: var(--teal); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dlg-head h3 { margin: 0; font-size: 1.15rem; } .dlg-head small { display: block; font-weight: 600; opacity: .9; }
.dlg-body { padding: 12px 16px 18px; overflow: auto; max-height: calc(86vh - 70px); }
.hist { border-bottom: 1px solid #E3ECEC; padding: 8px 0; }
.hist .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 800; }
.hist .meta { font-size: .8rem; color: var(--muted); font-weight: 600; }
.hist .w { font-size: .82rem; margin-top: 4px; color: #8A3B17; }
.pill { display: inline-block; font-size: .75rem; font-weight: 800; border: 2px solid var(--ink); border-radius: 99px; padding: 0 8px; }
.pill.hi { background: var(--good-tint); } .pill.mid { background: var(--yellow-tint); } .pill.lo { background: var(--orange-tint); }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Game dashboard<small id="updated"></small></h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" id="sheet-link" target="_blank" rel="noopener">Open Sheet ↗</a><button class="btn" type="button" onclick="location.reload()">↻ Refresh</button></div>
  </header>

  <div class="filters">
    <label>Class<select id="f-cls"></select></label>
    <label>Game<select id="f-game"></select></label>
    <label>Period<select id="f-days">
      <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="120">Last 4 months</option><option value="365">Last 12 months</option><option value="0">All time</option>
    </select></label>
  </div>

  <div class="kpis">
    <div class="kpi"><b id="k-students">0</b><span>students played</span></div>
    <div class="kpi"><b id="k-attempts">0</b><span>attempts</span></div>
    <div class="kpi"><b id="k-avg">–</b><span>average score</span></div>
    <div class="kpi"><b id="k-time">0</b><span>time spent playing</span></div>
  </div>

  <div class="grid2">
    <section class="card">
      <h2>Class summary <span class="tag">tap a class</span></h2>
      <div class="scroll" style="max-height:420px"><table id="t-classes"></table></div>
    </section>
    <section class="card">
      <h2>Common mistakes <span class="tag" id="mist-scope">all</span></h2>
      <div id="mistakes"></div>
    </section>
  </div>

  <section class="card">
    <h2>Who played what <span class="tag">tap a student</span></h2>
    <p class="legend"><span>attempts · best %</span><span><i style="background:var(--good-tint)"></i>80%+</span><span><i style="background:var(--yellow-tint)"></i>50–79%</span><span><i style="background:var(--orange-tint)"></i>below 50%</span></p>
    <div class="scroll"><table class="matrix" id="t-matrix"></table></div>
  </section>
</div>

<dialog id="dlg">
  <div class="dlg-head"><h3 id="dlg-title"></h3><button class="btn" type="button" onclick="document.getElementById('dlg').close()">Close</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script>
var P = <?!= payload ?>;
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  // rows: [t, game, chapter, cls, reg, name, score, total, pct, time, errs, wrong]
  var ROWS = P.rows.map(function (r) { return { t: r[0], game: r[1], chapter: r[2], cls: r[3], reg: r[4], name: r[5], score: r[6], total: r[7], pct: r[8], time: r[9], errs: r[10], wrong: r[11] }; });
  $("updated").textContent = "Updated " + P.updated + " · " + ROWS.length + " results in total";
  $("sheet-link").href = P.sheetUrl;

  var LEVELS = ["S1", "S2", "S3", "S4"], VALUES = ["Charity", "Courage", "Faith", "Hope", "Humility", "Integrity", "Love", "Respect", "Joy"];
  function rank(c) { var p = c.split(" "), l = LEVELS.indexOf(p[0]), v = VALUES.indexOf(p[1]); if (l > -1 && v > -1) return l * 10 + v; if (/^(S)?5 Faith$/.test(c)) return 50; return c === "Visitor" ? 90 : c === "Other" ? 91 : 80; }
  function byClass(a, b) { return rank(a) - rank(b) || (a < b ? -1 : a > b ? 1 : 0); }
  function key(r) { return r.cls + "|" + (r.reg ? String(Number(r.reg) || r.reg) : r.name.toLowerCase()); }
  function band(p) { return p == null ? "" : p >= 80 ? "hi" : p >= 50 ? "mid" : "lo"; }
  function fmtDate(t) { return t ? new Date(t).toLocaleDateString("en-SG", { day: "numeric", month: "short" }) : ""; }
  function fmtTime(s) { s = Math.round(s); if (s < 3600) return Math.round(s / 60) + " min"; return Math.floor(s / 3600) + " h " + Math.round((s % 3600) / 60) + " min"; }
  function isStudent(c) { return c !== "Visitor" && c !== "Other"; }

  // Filter options
  var classes = {}, games = {};
  ROWS.forEach(function (r) { classes[r.cls] = 1; games[r.game] = 1; });
  $("f-cls").innerHTML = '<option value="*">All students</option>' + Object.keys(classes).sort(byClass).map(function (c) { return "<option>" + esc(c) + "</option>"; }).join("") + '<option value="**">Everyone (incl. visitors)</option>';
  $("f-game").innerHTML = '<option value="*">All games</option>' + Object.keys(games).sort().map(function (g) { return "<option>" + esc(g) + "</option>"; }).join("");
  try { var saved = JSON.parse(localStorage.getItem("sik-dash") || "{}"); ["cls", "game", "days"].forEach(function (k) { var el = $("f-" + k); if (saved[k] && Array.prototype.some.call(el.options, function (o) { return o.value === saved[k]; })) el.value = saved[k]; }); } catch (e) {}
  ["f-cls", "f-game", "f-days"].forEach(function (id) { $(id).addEventListener("change", render); });

  function filtered(ignoreClass) {
    var c = $("f-cls").value, g = $("f-game").value, d = +$("f-days").value, since = d ? Date.now() - d * 864e5 : 0;
    return ROWS.filter(function (r) {
      if (r.t < since) return false;
      if (g !== "*" && r.game !== g) return false;
      if (ignoreClass) return c === "**" || isStudent(r.cls) || r.cls === c;
      if (c === "*") return isStudent(r.cls);
      if (c === "**") return true;
      return r.cls === c;
    });
  }

  function render() {
    try { localStorage.setItem("sik-dash", JSON.stringify({ cls: $("f-cls").value, game: $("f-game").value, days: $("f-days").value })); } catch (e) {}
    var rows = filtered(false);
    // KPIs
    var st = {}, pSum = 0, pN = 0, tSum = 0;
    rows.forEach(function (r) { st[key(r)] = 1; if (r.pct != null) { pSum += r.pct; pN++; } tSum += r.time || 0; });
    $("k-students").textContent = Object.keys(st).length;
    $("k-attempts").textContent = rows.length;
    $("k-avg").textContent = pN ? Math.round(pSum / pN) + "%" : "–";
    $("k-time").textContent = fmtTime(tSum);

    // Class summary (ignores the class filter so you can compare classes)
    var cs = {};
    filtered(true).forEach(function (r) {
      var c = cs[r.cls] = cs[r.cls] || { s: {}, n: 0, p: 0, pn: 0, last: 0 };
      c.s[key(r)] = 1; c.n++; if (r.pct != null) { c.p += r.pct; c.pn++; } c.last = Math.max(c.last, r.t);
    });
    var cl = Object.keys(cs).sort(byClass), sel = $("f-cls").value;
    $("t-classes").innerHTML = cl.length ? "<thead><tr><th>Class</th><th class='num'>Students</th><th class='num'>Attempts</th><th class='num'>Avg %</th><th class='num'>Last played</th></tr></thead><tbody>" +
      cl.map(function (c) { var x = cs[c], a = x.pn ? Math.round(x.p / x.pn) : null;
        return '<tr class="click" data-c="' + esc(c) + '"' + (c === sel ? ' style="outline:3px solid var(--orange);outline-offset:-3px"' : "") + "><td><b>" + esc(c) + "</b></td><td class='num'>" + Object.keys(x.s).length + "</td><td class='num'>" + x.n + "</td><td class='num'>" + (a == null ? "–" : '<span class="pill ' + band(a) + '">' + a + "%</span>") + "</td><td class='num'>" + fmtDate(x.last) + "</td></tr>"; }).join("") + "</tbody>"
      : '<tbody><tr><td class="empty">No results in this period.</td></tr></tbody>';
    Array.prototype.forEach.call($("t-classes").querySelectorAll("tr.click"), function (tr) {
      tr.addEventListener("click", function () { $("f-cls").value = $("f-cls").value === tr.dataset.c ? "*" : tr.dataset.c; render(); });
    });

    // Common mistakes
    var em = {};
    rows.forEach(function (r) { (r.errs || []).forEach(function (e) { var k = e[0], m = em[k] = em[k] || { n: 0, games: {} }; m.n += e[1]; m.games[r.game] = (m.games[r.game] || 0) + e[1]; }); });
    var ek = Object.keys(em).sort(function (a, b) { return em[b].n - em[a].n; }).slice(0, 10), top = ek.length ? em[ek[0]].n : 1;
    $("mist-scope").textContent = ($("f-cls").value === "*" ? "all students" : $("f-cls").value === "**" ? "everyone" : $("f-cls").value) + ($("f-game").value !== "*" ? " · " + $("f-game").value : "");
    $("mistakes").innerHTML = ek.length ? ek.map(function (k) {
      var g = Object.keys(em[k].games).sort(function (a, b) { return em[k].games[b] - em[k].games[a]; });
      return '<div class="err"><div><b>' + esc(k) + "</b><br><small>" + esc(g.join(", ")) + '</small></div><span class="n">×' + em[k].n + '</span><div class="bar"><i style="width:' + Math.round(100 * em[k].n / top) + '%"></i></div></div>';
    }).join("") : '<p class="empty">No mistakes recorded for this selection.</p>';

    // Student × game matrix
    var gs = {}, ss = {};
    rows.forEach(function (r) {
      gs[r.game] = 1;
      var k = key(r), s = ss[k] = ss[k] || { cls: r.cls, reg: r.reg, name: r.name, t: 0, g: {} };
      if (r.t >= s.t) { s.t = r.t; s.name = r.name || s.name; }
      var x = s.g[r.game] = s.g[r.game] || { n: 0, best: null }; x.n++; if (r.pct != null) x.best = x.best == null ? r.pct : Math.max(x.best, r.pct);
    });
    var gl = Object.keys(gs).sort(), sk = Object.keys(ss).sort(function (a, b) { var x = ss[a], y = ss[b]; return byClass(x.cls, y.cls) || ((Number(x.reg) || 999) - (Number(y.reg) || 999)) || (x.name < y.name ? -1 : 1); });
    var oneClass = $("f-cls").value !== "*" && $("f-cls").value !== "**";
    $("t-matrix").innerHTML = sk.length ? "<thead><tr><th class='stick'>Student</th>" + (oneClass ? "" : "<th>Class</th>") + gl.map(function (g) { return "<th class='g'>" + esc(g) + "</th>"; }).join("") + "<th class='num'>Last played</th></tr></thead><tbody>" +
      sk.map(function (k) { var s = ss[k];
        return '<tr class="click" data-k="' + esc(k) + '"><td class="stick"><span class="reg">' + esc(s.reg || "–") + '</span><span class="name">' + esc(s.name) + "</span></td>" + (oneClass ? "" : "<td>" + esc(s.cls) + "</td>") +
          gl.map(function (g) { var x = s.g[g]; return x ? '<td class="c ' + band(x.best) + '">' + x.n + " · " + (x.best == null ? "–" : x.best + "%") + "</td>" : '<td class="c"></td>'; }).join("") +
          "<td class='num'>" + fmtDate(s.t) + "</td></tr>"; }).join("") + "</tbody>"
      : '<tbody><tr><td class="empty">No one has played in this period yet.</td></tr></tbody>';
    Array.prototype.forEach.call($("t-matrix").querySelectorAll("tr.click"), function (tr) { tr.addEventListener("click", function () { openStudent(tr.dataset.k); }); });
  }

  function openStudent(k) {
    var all = ROWS.filter(function (r) { return key(r) === k; }).sort(function (a, b) { return b.t - a.t; });
    if (!all.length) return;
    var s = all[0], mins = 0; all.forEach(function (r) { mins += r.time || 0; });
    $("dlg-title").innerHTML = esc(s.name) + "<small>" + esc(s.cls) + (s.reg ? " · Reg " + esc(s.reg) : "") + " · " + all.length + " attempts · " + fmtTime(mins) + " (all time)</small>";
    $("dlg-body").innerHTML = all.map(function (r) {
      var errs = (r.errs || []).map(function (e) { return e[0] + (e[1] > 1 ? " ×" + e[1] : ""); }).join("; ");
      return '<div class="hist"><div class="top"><span>' + esc(r.game) + (r.chapter ? " · " + esc(r.chapter) : "") + "</span>" +
        (r.pct != null ? '<span class="pill ' + band(r.pct) + '">' + r.score + "/" + r.total + " · " + r.pct + "%</span>" : "") + "</div>" +
        '<div class="meta">' + new Date(r.t).toLocaleString("en-SG", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) + (r.time ? " · " + Math.round(r.time / 60 * 10) / 10 + " min" : "") + "</div>" +
        (errs ? '<div class="w">Mistakes: ' + esc(errs) + "</div>" : r.wrong && r.wrong !== "None" ? '<div class="w">Wrong: ' + esc(r.wrong) + "</div>" : "") + "</div>";
    }).join("");
    $("dlg").showModal();
  }

  render();
})();
</script>
</body>
</html>
